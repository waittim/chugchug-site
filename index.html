    <script>
      (function () {
        var path = location.pathname;
        var privacy = /privacy\.html$/.test(path);
        var page = privacy ? 'privacy.html' : '';
        function prefix(code) {
          var value = String(code || '').toLowerCase();
          if (value.indexOf('zh-hant') === 0 || value.indexOf('zh-tw') === 0 || value.indexOf('zh-hk') === 0 || value.indexOf('zh-mo') === 0) return '/zh-Hant/';
          if (value.indexOf('zh') === 0) return '/zh/';
          return '/';
        }
        function here() {
          if (privacy) return path;
          return path.endsWith('/') ? path : path + '/';
        }
        var queryLang = new URLSearchParams(location.search).get('lang');
        if (queryLang) {
          try { localStorage.setItem('preferred_lang', queryLang); } catch (e) {}
          var target = prefix(queryLang) + page;
          if (here() !== target) {
            location.replace(target);
            return;
          }
          if (window.history && window.history.replaceState) {
            window.history.replaceState(null, '', target);
          }
          return;
        }
        if (/\/zh-Hant(\/|$)/.test(path)) {
          try { localStorage.setItem('preferred_lang', 'zh-Hant'); } catch (e) {}
          return;
        }
        if (/\/zh(\/|$)/.test(path)) {
          try { localStorage.setItem('preferred_lang', 'zh'); } catch (e) {}
          return;
        }
        var saved = null;
        try { saved = localStorage.getItem('preferred_lang'); } catch (e) {}
        if (saved) {
          var savedDest = prefix(saved);
          if (savedDest === '/') return;
          location.replace(savedDest + page);
          return;
        }
        var nav = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
        var dest = prefix(nav);
        if (dest === '/') return;
        location.replace(dest + page);
      })();
    </script>
